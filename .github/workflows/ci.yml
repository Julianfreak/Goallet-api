name: CI - Goallet API Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Unit Tests
        run: |
          go test -v -race \
            -coverpkg=./internal/... \
            -coverprofile=coverage.out ./...

      - name: Verify Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Total Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "Error: La cobertura ($COVERAGE%) es menor al umbral mínimo del 80%"
            exit 1
          fi
          
  build-and-verify:
    name: Build Docker Stack & Verify
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Log File Permissions
        run: |
          touch app.log
          chmod 666 app.log

      - name: Start Docker Compose Stack
        env:
          GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
          GF_ALLOW_SIGN_UP: "false"
        run: |
          docker compose up -d --build

      - name: Verify Container Status
        run: |
          sleep 5
          docker compose ps

      - name: Tear Down Stack
        if: always()
        run: docker compose down