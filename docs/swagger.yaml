basePath: /api/v1
definitions:
  domain.Cuenta:
    properties:
      created_at:
        type: string
      id:
        type: string
      saldo:
        type: number
      titular:
        type: string
    type: object
  domain.Movimiento:
    properties:
      created_at:
        type: string
      cuenta_id:
        type: string
      id:
        type: string
      monto:
        type: number
      saldo_anterior:
        type: number
      saldo_nuevo:
        type: number
      tipo:
        $ref: '#/definitions/domain.TipoMovimiento'
    type: object
  domain.TipoMovimiento:
    enum:
    - DEPOSITO
    - RETIRO
    - TRANSFERENCIA_ENVIADA
    - TRANSFERENCIA_RECIBIDA
    type: string
    x-enum-varnames:
    - TipoDeposito
    - TipoRetiro
    - TipoTransferenciaEnviada
    - TipoTransferenciaRecibida
  domain.TipoTransaccion:
    enum:
    - DEPOSITO
    - RETIRO
    - TRANSFERENCIA
    type: string
    x-enum-varnames:
    - Deposito
    - Retiro
    - Transferencia
  domain.Transaccion:
    properties:
      cuenta_destino_id:
        type: string
      cuenta_origen_id:
        type: string
      fecha:
        type: string
      id:
        type: string
      monto:
        type: number
      tipo:
        $ref: '#/definitions/domain.TipoTransaccion'
    type: object
  dto.ActualizarTitularRequest:
    properties:
      nuevo_titular:
        type: string
    required:
    - nuevo_titular
    type: object
  dto.CrearCuentaRequest:
    properties:
      saldo_inicial:
        type: number
      titular:
        type: string
    required:
    - titular
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: mensaje de error explicativo
        type: string
    type: object
  dto.MensajeResponse:
    properties:
      mensaje:
        example: operación realizada exitosamente
        type: string
    type: object
  dto.OperacionMontoRequest:
    properties:
      monto:
        type: number
    required:
    - monto
    type: object
  dto.TransferirRequest:
    properties:
      cuenta_destino_id:
        type: string
      monto:
        type: number
    required:
    - cuenta_destino_id
    - monto
    type: object
host: localhost:8090
info:
  contact:
    email: julianrideon@gmail.com
    name: Julian Dario Serna Saavedra
    url: https://github.com/Julianfreak/Goallet-api
  description: API RESTful para gestión de cuentas, transacciones y auditoría financiera
    con arquitectura hexagonal.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Goallet API - Motor Transaccional de Billetera Digital
  version: "1.0"
paths:
  /api/v1/cuentas/{id}/movimientos:
    get:
      description: Retorna la lista de todos los movimientos y auditoría de una cuenta
        específica
      parameters:
      - description: ID de la Cuenta (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Movimiento'
            type: array
      security:
      - BearerAuth: []
      summary: Consultar historial de transacciones (Ledger)
      tags:
      - Movimientos
  /cuentas:
    get:
      description: Obtiene el listado completo de cuentas registradas en el sistema
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Cuenta'
            type: array
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar todas las cuentas
      tags:
      - Cuentas
    post:
      consumes:
      - application/json
      description: Registra un titular y asigna un saldo inicial opcional
      parameters:
      - description: Datos de apertura de cuenta
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CrearCuentaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Cuenta'
        "400":
          description: Formato de datos inválido o titular ausente
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Crear nueva cuenta bancaria
      tags:
      - Cuentas
  /cuentas/{id}:
    delete:
      description: Elimina una cuenta existente únicamente si su saldo es igual a
        0
      parameters:
      - description: ID de la cuenta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cuenta eliminada exitosamente
          schema:
            $ref: '#/definitions/dto.MensajeResponse'
        "400":
          description: La cuenta tiene saldo pendiente
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Cuenta no encontrada
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Eliminar una cuenta
      tags:
      - Cuentas
    get:
      description: Obtiene la información detallada de una cuenta existente
      parameters:
      - description: ID de la cuenta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cuenta'
        "404":
          description: Cuenta no encontrada
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar cuenta por ID
      tags:
      - Cuentas
    put:
      consumes:
      - application/json
      description: Modifica el nombre del titular asociado a una cuenta
      parameters:
      - description: ID de la cuenta
        in: path
        name: id
        required: true
        type: string
      - description: Nuevo nombre del titular
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ActualizarTitularRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cuenta'
        "400":
          description: Petición inválida
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Cuenta no encontrada
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar el titular de una cuenta
      tags:
      - Cuentas
  /cuentas/{id}/depositar:
    post:
      consumes:
      - application/json
      description: Incrementa el saldo de una cuenta con un monto positivo
      parameters:
      - description: ID de la cuenta
        in: path
        name: id
        required: true
        type: string
      - description: Monto a depositar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OperacionMontoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaccion'
        "400":
          description: Monto inválido o cuerpo de petición incorrecto
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Cuenta no encontrada
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Realizar un depósito
      tags:
      - Transacciones
  /cuentas/{id}/retirar:
    post:
      consumes:
      - application/json
      description: Deduce un monto de una cuenta si dispone de saldo suficiente
      parameters:
      - description: ID de la cuenta
        in: path
        name: id
        required: true
        type: string
      - description: Monto a retirar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OperacionMontoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaccion'
        "400":
          description: Monto inválido o saldo insuficiente
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Cuenta no encontrada
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Realizar un retiro
      tags:
      - Transacciones
  /cuentas/{id}/transferir:
    post:
      consumes:
      - application/json
      description: Realiza una transferencia desde la cuenta origen hacia la cuenta
        de destino
      parameters:
      - description: ID de la cuenta origen
        in: path
        name: id
        required: true
        type: string
      - description: Datos de la transferencia
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TransferirRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaccion'
        "400":
          description: Datos inválidos, saldo insuficiente o misma cuenta
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Cuenta no encontrada
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Transferir fondos entre cuentas
      tags:
      - Transacciones
securityDefinitions:
  BearerAuth:
    description: 'Escribe "Bearer " seguido de tu token JWT. Ejemplo: "Bearer eyJhbGciOi..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
